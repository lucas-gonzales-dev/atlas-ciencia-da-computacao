<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf7f0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17181a">
<meta name="description" content="A sua próxima estação na trilha de Ciência da Computação da Universidade Brasileira Livre.">
<title>Atlas — a sua próxima estação</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- PEDIDO 16 (29/10/2026): a tela começa a virar o mapa de metrô.
     tokens.css é a única fonte de cor/tipo/espaço/movimento; fontes.css declara
     a Overpass (SIL OFL 1.1, woff2 local); metro.css é o desenho desta tela e
     não escreve nenhum valor à mão. Não há build: o que está no disco é o que o
     navegador usa. O app antigo (index.html) continua intacto enquanto a
     migração dos --p-* restantes não termina. -->
<link rel="stylesheet" href="./web/tokens.css">
<!-- S2 da v2 (31/10/2026): base.css é a base que toda página herda — o fundo
     no html e no body (não só no contêiner), o anel de foco de 3 px e a classe
     .so-leitor. Vem LOGO DEPOIS do tokens.css: antes dele, as variáveis ainda
     não existem e o fundo volta a ser branco no escuro. -->
<link rel="stylesheet" href="./web/base.css">
<link rel="stylesheet" href="./web/fontes.css">
<link rel="stylesheet" href="./web/metro.css">
</head>
<body class="l6">
<!-- A marca definitiva (S1, 30/10/2026): símbolo em PNG e a palavra "atlas"
     pintada por máscara, então a letra troca de cor com o tema sem precisar de
     um segundo arquivo. Fica FORA do main: é o cabeçalho do app, não conteúdo
     da tela, e continua no lugar enquanto o metro.js desenha a placa. -->
<header class="topo">
  <a class="topo-marca" href="./metro.html" aria-label="Atlas, início">
    <img class="marca-simbolo" src="marca/simbolo.png" alt="" width="42" height="24">
    <span class="marca-palavra" aria-hidden="true"></span>
  </a>
</header>
<main id="metro" class="metro">
  <p class="placa-rotulo">Carregando a rede…</p>
</main>
<!-- A lógica de abrir a página mora em web/metro.js, um MÓDULO com teste no
     node (tests/metro.test.js). Aqui só fica a tag: código inline não entra em
     teste nenhum, e foi assim que o ReferenceError de 27/10 chegou ao celular. -->
<script type="module" src="./web/metro.js"></script>
</body>
</html>
