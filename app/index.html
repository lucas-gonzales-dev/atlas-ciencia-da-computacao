<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Trilha de Ciência da Computação da Universidade Livre Brasileira, com pré-requisitos e progresso.">
<title>Projeto Atlas — Ciência da Computação</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icone.svg">
<style>
  /* Mobile-first de verdade: o padrao E o celular. Tela grande so ganha
     largura e colunas, nunca outra estrutura. */
  :root {
    --fundo: #0b1020; --cartao: #151b30; --borda: #26304d;
    --texto: #e8ecf7; --fosco: #93a0c2;
    --aberto: #38d39f; --feito: #6aa9ff; --trancado: #5a6482; --alerta: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 16px 14px 48px; }
  h1 { font-size: 1.5rem; margin: 4px 0 2px; letter-spacing: -.02em; }
  .sub, .fonte { margin: 2px 0; color: var(--fosco); font-size: .84rem; }
  .fonte { font-size: .76rem; opacity: .85; word-break: break-word; }
  .alerta {
    margin: 12px 0; padding: 10px 12px; border-radius: 10px; font-size: .86rem;
    background: #3a2a12; border: 1px solid #6b4a1c; color: var(--alerta);
  }
  .carregando { color: var(--fosco); }
  .trilha { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .item {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
    background: var(--cartao); border: 1px solid var(--borda); border-left: 4px solid var(--trancado);
    border-radius: 12px; padding: 12px 14px;
  }
  .item .titulo { grid-column: 1; font-weight: 600; }
  .item .status { grid-column: 2; grid-row: 1; font-size: .74rem; color: var(--fosco); text-align: right; }
  .item .marca { grid-column: 1 / -1; grid-row: 3; justify-self: start; }
  .item .recurso { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  a.recurso {
    margin-top: 8px; min-height: 40px; padding: 8px 14px; border-radius: 9px;
    border: 1px solid var(--borda); background: #101a30; color: var(--feito);
    font-size: .86rem; font-weight: 600; text-decoration: none;
    display: inline-flex; align-items: center;
  }
  a.recurso:active { transform: translateY(1px); }

  /* BIBLIOGRAFIA (item 3): caminho da fonte, nao conteudo do Atlas. Entra na
     mesma grade do item, abaixo do recurso, e a nota de nao-verificado fica em
     texto menor — e aviso, nao rodape decorativo. */
  .item .biblio { grid-column: 1 / -1; grid-row: 3; display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  a.biblio-link {
    color: #9fb8d8; font-size: 0.82rem; text-decoration: none;
    border-bottom: 1px dashed rgba(159, 184, 216, 0.5); align-self: flex-start;
    word-break: break-all;
  }
  a.biblio-link:hover, a.biblio-link:focus-visible { color: #d8e4f5; border-bottom-style: solid; }
  .biblio-nota { color: #8a8f98; font-size: 0.72rem; line-height: 1.35; }
  /* Alvo de toque minimo de 44px no celular: o padding acima ja garante. */
  .item.disponivel { border-left-color: var(--aberto); }
  .item.disponivel .status { color: var(--aberto); }
  .item.concluida { border-left-color: var(--feito); opacity: .82; }
  .item.concluida .status { color: var(--feito); }
  .item.concluida .titulo { text-decoration: line-through; text-decoration-color: #4a5a80; }
  .item.trancada, .item.ciclo { opacity: .62; }
  .item.ciclo .status { color: var(--alerta); }
  button.marca {
    margin-top: 8px; min-height: 40px; padding: 8px 16px; border-radius: 9px;
    border: 1px solid var(--borda); background: #1d2740; color: var(--texto);
    font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer;
  }
  button.marca:active { transform: translateY(1px); }
  button.marca:disabled { cursor: not-allowed; opacity: .45; }
  .item.disponivel button.marca { background: #12352a; border-color: #1f6b52; color: var(--aberto); }
  .item.concluida button.marca { background: #16233d; border-color: #2c4c7d; color: var(--feito); }
  /* ELETIVAS ARQUIVADAS (24/10/2026): mesma linguagem visual da grade, mas com
     borda esquerda cinza e opacidade menor — o olho tem de entender em meio
     segundo que isto NAO e o caminho obrigatorio. Sem cor de "disponivel",
     porque disponivel aqui so existe para a grade. */
  section.eletivas { margin-top: 34px; }
  section.eletivas h2 { font-size: 1.15rem; margin: 0 0 4px; letter-spacing: -.01em; }
  .aviso-eletivas {
    margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; font-size: .84rem;
    background: #1b1f33; border: 1px solid var(--borda); color: var(--fosco);
  }
  .eletivas-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .item.eletiva {
    grid-template-columns: 1fr; opacity: .78;
    border-left-color: var(--trancado);
  }
  .item.eletiva .titulo { grid-column: 1; font-weight: 600; }
  .item.eletiva .prereq-texto { grid-column: 1; color: var(--fosco); font-size: .8rem; }
  .item.eletiva .topicos { grid-column: 1; color: var(--fosco); font-size: .8rem; margin-top: 4px; }
  .item.eletiva .recurso { grid-column: 1; }
  /* ESPECIALIZACOES (24/10/2026): sao conteudo de aprofundamento, nao a grade.
     Ficam entre a trilha e as eletivas, com recursos em lista aninhada — no
     celular cada linha de recurso precisa de area de toque inteira (min-height),
     porque link pequeno em lista longa e link que o dedo erra. */
  section.especializacoes { margin-top: 34px; }
  section.especializacoes h2 { font-size: 1.15rem; margin: 0 0 4px; letter-spacing: -.01em; }
  .esp-lista { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; }
  .item.esp { grid-template-columns: 1fr; align-items: start; }
  .item.esp .titulo { grid-column: 1; font-weight: 600; }
  .item.esp .status { grid-column: 1; color: var(--fosco); font-size: .78rem; }
  .item.esp.aguardando { border-left-color: #8a6a1f; background: #1d1a12; }
  .aviso-esp {
    grid-column: 1; margin: 6px 0 0; padding: 9px 11px; border-radius: 9px;
    font-size: .82rem; line-height: 1.45; color: #e9d9a8;
    background: #2a2313; border: 1px solid #55461f;
  }
  .esp-recursos { list-style: none; grid-column: 1; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
  .esp-recursos li { padding: 7px 0; border-bottom: 1px solid var(--borda); font-size: .9rem; line-height: 1.4; }
  .esp-recursos li:last-child { border-bottom: 0; }
  .esp-recursos a { min-height: 44px; display: inline-flex; align-items: center; }
  .esp-meta { color: var(--fosco); font-size: .8rem; }
  .esp-nota { color: #c9b98a; font-size: .78rem; }
  /* PROGRESSO PORTATIL (27/10/2026): exportar/importar. Os dois botoes cabem
     lado a lado em tela larga e empilham no celular — flex-wrap, sem media
     query propria. Alvo de toque minimo de 44px vem do button.marca. */
  section.progresso-io { margin-top: 34px; }
  section.progresso-io h2 { font-size: 1.15rem; margin: 0 0 4px; letter-spacing: -.01em; }
  .io-acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .io-acoes .marca { flex: 1 1 auto; }
  .importar-arquivo { display: none; }
  .io-recado { margin: 10px 0 0; color: var(--fosco); font-size: .84rem; min-height: 1.2em; }
  @media (min-width: 620px) {
    .app { padding: 28px 20px 64px; }
    h1 { font-size: 1.9rem; }
    .item { grid-template-columns: 1fr auto auto; }
    .item .status { grid-row: 1; }
    .item .marca { grid-column: 3; grid-row: 1; justify-self: end; margin-top: 0; }
    .item .recurso { grid-column: 1 / -1; grid-row: 2; justify-self: start; margin-top: 0; }
  }
</style>
</head>
<body>
<main id="app" class="app" aria-live="polite">
  <p class="carregando">Carregando a trilha…</p>
</main>

<script type="module">
import { loadCatalog, loadCompleted, saveCompleted, render, bind, bindProgressIO } from './web/main.js';

const root = document.getElementById('app');

let state = { courses: [], completed: loadCompleted(), origem: 'carregando…' };

function paint() {
  render(root, state);
}

// Unico lugar que muda `completed`. Regra de negocio fica em core/progress.js.
function toggle(id) {
  const tem = state.completed.includes(id);
  state.completed = tem
    ? state.completed.filter((x) => x !== id)
    : [...state.completed, id];

  if (!saveCompleted(state.completed)) aviso('Não consegui salvar neste navegador: o progresso vale só enquanto esta aba estiver aberta.');
  paint();
}

function aviso(texto) {
  root.querySelector('p.aviso-save')?.remove();
  const p = document.createElement('p');
  p.className = 'alerta aviso-save';
  p.textContent = texto;
  root.prepend(p);
}

const { courses, origem, electives, origemEletivas, specializations, origemEspecializacoes } = await loadCatalog();
state = { ...state, courses, origem, electives, origemEletivas, specializations, origemEspecializacoes };
paint();
bind(root, state, toggle);

// EXPORTAR/IMPORTAR PROGRESSO (27/10/2026). A validacao mora em
// core/progress-io.js (com teste); aqui so ha estado e recado na tela.
// `estado` e uma FUNCAO de proposito: `state` e substituido a cada paint, e um
// valor capturado aqui envelheceria na primeira interacao — o importador
// validaria contra um catalogo vazio e recusaria arquivo bom.
bindProgressIO(root, {
  estado: () => state,
  aplicar: (ids) => {
    state = { ...state, completed: ids };
    if (!saveCompleted(ids)) {
      aviso('Importei, mas não consegui salvar neste navegador: o progresso vale só enquanto esta aba estiver aberta.');
    }
    paint();
  },
  // O hook se chama `avisar`; a funcao desta pagina se chama `aviso`. Escrever
  // so `avisar` aqui seria shorthand de uma variavel que NAO existe — e o erro
  // so apareceria no navegador, nunca no node (testar_pagina pegou em 27/10).
  avisar: aviso
});

// Service worker DEPOIS da primeira pintura: registrar antes atrasaria o que
// o aluno veio ver. Falha aqui nao pode derrubar a tela — em file:// e em
// navegadores sem suporte, `navigator.serviceWorker` simplesmente nao existe.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  try {
    // Escopo vem da URL do documento, nunca de '/': publicado em /<repo>/, um
    // escopo na raiz do dominio faria o navegador RECUSAR o registro (o sw.js
    // estaria fora do escopo pedido) e o app perderia o offline em silencio.
    const escopo = new URL('./', document.baseURI).pathname;
    const reg = await navigator.serviceWorker.register('sw.js', { scope: escopo });
    reg.addEventListener('updatefound', () => {
      const novo = reg.installing;
      novo?.addEventListener('statechange', () => {
        if (novo.state === 'activated') aviso('Nova versão instalada. Ela vale na próxima abertura.');
      });
    });
  } catch (e) {
    console.warn('service worker nao registrou:', e.message);
  }
}
</script>
</body>
</html>
