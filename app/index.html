<!-- DESIGN SYSTEM (29/10/2026): tokens.css e a UNICA fonte de cor, tipo,
     espaco, raio, duracao e ponto de quebra do app; fontes.css declara a
     Overpass (SIL OFL 1.1, woff2 local em app/fonts/). Os dois vem ANTES da
     grade.css para que ela possa usar var(--*): abaixo dos tokens, a variavel
     ainda nao existe e a tela abre sem cor. Nao ha build: o que esta no disco e
     o que o navegador usa. -->
<link rel="stylesheet" href="./web/tokens.css">
<link rel="stylesheet" href="./web/fontes.css">
<!-- GRADE (31/10/2026, S3a-1): o layout da tela saiu do estilo inline
     do index.html e virou web/grade.css, escopado em .grade. Motivo: CSS dentro
     da pagina nao entra em teste nenhum — tests/grid-celulas.test.js le as
     regras de posicao do cartao de um ARQUIVO, e foi assim que a sobreposicao do
     botao Concluir sobre a nota da bibliografia sobreviveu a 153 testes verdes.
     Paleta provisoria (--p-*) NAO migrou aqui: a migracao e a S3b. -->
<link rel="stylesheet" href="./web/grade.css">
</head>
<body class="grade">
<!-- BUSCA (27/10/2026): slot FORA do #app — render() limpa o root a cada
     redesenho, e um input la dentro perderia o foco a cada tecla. Fica
     escondido ate o catalogo carregar (sem dados, busca nao faz sentido). -->
<div id="busca-slot" class="busca-slot" hidden></div>
<main id="app" class="app" aria-live="polite">
  <p class="carregando">Carregando a trilha…</p>
</main>

<!-- BOOT (27/10/2026): a logica de abrir a pagina mora em web/boot.js, um
     MODULO — com teste no node (tests/boot.test.js). Aqui so fica a tag.
     Motivo, e nao arrumacao: o que estava inline NAO entrava em teste nenhum
     (o node importa modulos, nao HTML), e foi assim que um ReferenceError no
     fio `avisar` do importador de progresso chegou ao navegador sem que a
     suite visse. tests/boot.test.js tambem falha se codigo voltar para dentro
     desta pagina. -->
<script type="module" src="./web/boot.js"></script>
</body>
